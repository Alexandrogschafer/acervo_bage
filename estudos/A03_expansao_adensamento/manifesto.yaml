# ---------------------------------------------------------------------------
# manifesto.yaml — CONTRATO do estudo com o acervo
#
# Declara exatamente quais camadas do acervo este estudo consome e em que
# estado elas estavam. É o que permite, meses depois, saber sobre qual dado um
# resultado foi produzido.
#
# Esquema:
#   estudo:           <REPO>-<id do diretório>
#   pergunta:         a pergunta que o estudo responde (uma frase)
#   camadas:          produto CURADO do acervo, cada entrada:
#                       - id: <id_camada em data/catalogo_camadas.csv>
#                         versao: <versão fixada>
#                         sha256: <sha256 do arquivo no momento em que foi fixado>
#   fontes_brutas:    DADO BRUTO em data/raw/, cada entrada:
#                       - fonte_id: <id_fonte em data/catalogo_fontes.csv>
#                         arquivo: <caminho sob data/raw/>
#                         versao: / sha256: <como no .json irmão do arquivo>
#   referencias_bib:  chaves de bibliografia/bage.bib
#   status:           planejado | reconhecimento | em-andamento | concluido
#
# Conferir com:
#   python scripts/utils/indice.py      (gera docs/indice_camadas_estudos.md)
#
# Se o acervo mudar, a conferência acusa "divergente" — e NÃO corrige sozinha.
# Atualizar o sha256 aqui é decisão do responsável, nunca automática: ela
# declara que o resultado foi revisto sobre o dado novo.
#
# O estudo LÊ o acervo e nunca escreve nele. Saídas ficam em saidas/,
# intermediários em derivados/ — os dois fora do git (ver .gitignore).
#
# A maior parte do que este estudo consome (grade estatística, agregados por
# setor, entorno, de/para) é DADO BRUTO em data/raw/, registrado em
# data/catalogo_fontes.csv, e não camada do acervo: vai em `fontes_brutas:`,
# conferido por scripts/utils/manifesto.py contra o catálogo de fontes e o
# `.json` irmão de cada arquivo, com os mesmos estados das camadas. A
# diferença entre os dois blocos está em docs/convencoes.md § 5, junto com a
# decisão de NÃO promover bruto a camada: o que virará camada é o produto
# deste estudo, depois de conferido.
# ---------------------------------------------------------------------------

estudo: ACERVO_BAGE-A03_expansao_adensamento
status: "planejado"

pergunta: >-
  Bagé ganhou 6.791 domicílios ocupados (+17,6 %) com a população praticamente
  estável (+1,0 %) entre 2010 e 2022. ONDE, no território do município, esse
  crescimento de domicílios se materializou — em ocupação de área nova ou em
  adensamento da área já ocupada —, e QUE INFRAESTRUTURA URBANA existe em 2022
  nas áreas que cresceram, comparada à do restante da cidade?

# Decidida pelo responsável em 2026-09-22, sobre estudos/A03_expansao_adensamento/
# dimensionamento.md § 5.3.
subordinadas:
  # Números corrigidos em 2026-09-23: os anteriores vinham da junção por
  # ID_UNICO do d03 (SUPERADO), que contava a troca de resolução da grade como
  # ocupação nova. Texto anterior, até 2026-09-23:
  #   "1. Quanto do crescimento é expansão e quanto é adensamento? Pela grade
  #   estatística, já se sabe o tamanho: 5.709 domicílios em 573 células novas e
  #   8.461 em 568 células que já tinham domicílio. Falta caracterizar essas duas
  #   geografias — onde estão, que densidade têm e quanto de população acompanhou
  #   (15.385 pessoas nas células novas)."
  # CONCLUÍDA em 2026-09-23 (resultados_s1.md § 11), com o setor rural de 2010
  # 430160205000136 declarado À PARTE por decisão do responsável (4 células com
  # assinatura de desagregação, 31 das 232 extintas; resultados_s1.md § 10.6).
  # Texto anterior, até 2026-09-23 (números com todas as unidades, hoje a
  # sensibilidade):
  #   "1. Quanto do crescimento é expansão e quanto é adensamento? Pela grade
  #   estatística, na unidade harmonizada (resultados_s1.md §§ 3–4): 1.884
  #   domicílios em 355 unidades novas e 10.215 em 590 unidades que já tinham
  #   domicílio — a expansão fica entre 15,6 % e 30,1 % do ganho bruto de 12.099
  #   domicílios. Caracterizar essas duas geografias — onde estão, que densidade
  #   têm e quanto de população acompanhou (4.604 moradores nas unidades novas)."
  - >-
    1. [CONCLUÍDA em 2026-09-23 — resultados_s1.md § 11] Quanto do crescimento
    é expansão e quanto é adensamento? Pela grade estatística, na unidade
    harmonizada e com o setor rural de 2010 430160205000136 À PARTE (grade de
    2010 desagregada ali; resultados_s1.md §§ 10.6 e 11): 1.883 domicílios em
    354 unidades novas e 9.489 em 586 unidades que já tinham domicílio — a
    expansão fica entre 16,6 % e 25,6 % do ganho bruto de 11.372 domicílios;
    201 extintas com 578 domicílios; perda bruta de 4.248; 4.602 moradores nas
    unidades novas. Sensibilidade com todas as unidades: 15,6–30,1 % de 12.099;
    232 extintas com 807; perda bruta de 4.624.
  # Números corrigidos em 2026-09-23: os anteriores vinham da junção por
  # ID_UNICO do d03 (SUPERADO), que contava a troca de resolução da grade como
  # ocupação nova. Texto anterior, até 2026-09-23:
  #   "2. Onde domicílio e população andam em direções opostas? As 132 células que
  #   ganham domicílio e perdem população (+804 domicílios, −2.044 pessoas) são o
  #   retrato do encolhimento domiciliar no território — moradores por domicílio
  #   caiu de 3,02 para 2,59 no município. Verificar se essas células formam área
  #   contígua (centro? bairros antigos?) ou estão dispersas."
  - >-
    2. Onde domicílio e população andam em direções opostas? As 137 unidades da
    grade (8,0 % das 1.707 com domicílio, na unidade harmonizada) que ganham
    domicílio e perdem população (+843 domicílios, −2.095 pessoas;
    resultados_s1.md § 8) são o retrato do encolhimento domiciliar no
    território — moradores por domicílio caiu de 3,02 para 2,59 no município.
    Verificar se essas unidades formam área contígua (centro? bairros antigos?)
    ou estão dispersas.
  - >-
    3. A infraestrutura do entorno acompanha onde a cidade cresceu? Cruzar as
    áreas de crescimento com pavimentação, bueiro, obstáculo na calçada,
    arborização e rampa, lendo 2022 como retrato transversal. Iluminação entra
    como controle (universal em Bagé) e ciclovia como ausência.

# Decidido pelo responsável em 2026-09-22.
recorte_espacial:
  # Corrigido em 2026-09-23: a afirmação de que a grade é a mesma geografia
  # nos dois anos estava errada — a conferência do d03 olhou só as células de
  # mesmo ID e não viu a troca de resolução. Texto anterior, até 2026-09-23:
  #   "Grade estatística para a mudança 2010 → 2022: é a única geografia fixa
  #   entre os dois censos, e a coincidência das células está conferida
  #   (dimensionamento.md § 3.1: 5.677 células comuns, centroides a 4,9e-5 m,
  #   área a 0,14 m²)."
  - >-
    Grade estatística para a mudança 2010 → 2022, comparada na UNIDADE
    HARMONIZADA. A grade é aninhada, mas não é a mesma nas duas edições: em 41
    lugares do município o IBGE refinou a resolução entre 2010 e 2022, e a
    célula de 1 km de 2010 aparece em 2022 como as 25 células de 200 m que a
    compõem. A comparação é a mãe de 1 km contra a soma das suas 25 filhas;
    juntar por ID_UNICO trata o refinamento como ocupação nova. Conferido em
    resultados_s1.md § 1 (as filhas cobrem a mãe com desvio máximo de 0,1 m²,
    em ESRI:102033; nas 5.677 células de mesmo ID, centroides a 4,9e-5 m e
    área a 0,14 m²). Regra geral do acervo: docs/ressalvas_censo_bage.md § 7.
  - >-
    Setor censitário de 2022 para o entorno: é o único recorte em que o entorno
    existe (168 setores por domicílio, 171 por face).
  - >-
    Junção espacial célula → setor, com a incerteza da atribuição MEDIDA e
    DECLARADA (célula que cai em mais de um setor, e quanto do dado isso
    envolve). Sem a medida da incerteza, o cruzamento não entra no artigo.
  - >-
    Área mínima comum só se surgir necessidade de atributo do censo em série
    (§ 3.1 do reconhecimento).
  - >-
    Urbano e rural, quando usados, definidos GEOGRAFICAMENTE (área urbanizada
    ou a própria grade), NUNCA pelo rótulo de situação do setor — ver
    metodo_previsto.

# Não são perguntas subordinadas: são os três resultados metodológicos do artigo.
# (Até 2026-09-23: "os dois"; o terceiro, grade de 2010 híbrida, entrou nesse dia.)
metodo_previsto:
  - >-
    A reclassificação de 13 setores rurais de 2010 em setores urbanos de 2022
    (11.476 pessoas e 3.427 DPP; 67 % do ganho urbano de população e 72 % da
    perda rural) entra como SEÇÃO DE MÉTODO: mostra por que a série urbano ×
    rural pelo rótulo de situação do setor produz um falso êxodo rural, e por
    que o artigo usa definição geográfica. Medido em dimensionamento.md § 1.3,
    por scripts/d01_descompasso.py.
  - >-
    A troca de resolução da grade estatística entre 2010 e 2022 (41 células de
    1 km de 2010 que aparecem em 2022 como 25 células de 200 m cada) entra como
    SEÇÃO DE MÉTODO, segundo achado metodológico do artigo: juntar as edições
    por ID_UNICO conta o refinamento como ocupação nova e leva a expansão a
    40 % do ganho bruto de domicílios; na unidade harmonizada ela fica entre
    15,6 % e 30,1 %. Medido em resultados_s1.md §§ 1, 4 e 8, por
    scripts/s1_expansao_adensamento.py; regra geral em
    docs/ressalvas_censo_bage.md § 7.
  - >-
    A grade estatística de 2010 é HÍBRIDA por método do IBGE (Grade
    Estatística, 2016, p. 16–22): setor com ausência de localização acima de
    50 % entra por desagregação (dasimétrico por vias, por uso e cobertura ou
    ponderação zonal), e o urbano agregado entra pela face de quadra. A de 2022
    é contagem direta de endereços do CNEFE. Entra como SEÇÃO DE MÉTODO,
    terceiro achado metodológico do artigo: comparar 2010 com 2022 sem separar
    a abordagem mistura dado modelado com observado. A variável de abordagem
    por célula (p. 21) NÃO acompanha o produto do geoftp, e a regra não se
    reconstrói, porque a ausência de localização por setor não é publicada.
    Detecção indireta (resultados_s1.md § 10.6, scripts/s1_desagregacao_2010.py):
    o teste da razão do setor não discrimina; o de pares idênticos contíguos
    marca 1 setor rural (430160205000136: 968 domicílios de 2010, 31 das 232
    extintas). Pedido ao IBGE redigido em
    docs/pedido_ibge_grade_2010_abordagem.md; regra geral em
    docs/ressalvas_censo_bage.md § 8.

# Decisões, não pendências.
fora_do_escopo:
  - >-
    Série de vagos e uso ocasional 2010 → 2022: 2010 não está no acervo
    (dimensionamento.md § 1.2). Com o dado de 2022 sozinho dá para descrever o
    estoque (8.302 domicílios não ocupados, 44,5 % dos particulares no rural),
    não a mudança.
  - >-
    Obter os não ocupados de 2010: DECIDIDO NÃO OBTER, em 2026-09-22. A
    vacância não é eixo deste artigo e o dado de 2010 só existe em nível
    municipal — não serviria ao recorte territorial do estudo. Fica registrado
    como decisão, não como pendência.
  - >-
    Série de entorno 2010 → 2022: pela classificação do próprio IBGE só
    iluminação e bueiro são comparáveis, e iluminação é universal em Bagé
    (99,3 %, IQR de 0,3 ponto entre setores) — não diferencia área nenhuma.
  - >-
    Leitura urbano × rural entre censos pelo rótulo de situação do setor: 67 %
    do salto urbano é reclassificação (ver metodo_previsto).

