# ---------------------------------------------------------------------------
# fontes_censo_ibge.yaml — lista FIXA dos arquivos do Censo baixados do IBGE
#
# Lida por scripts/download/baixar_censo_ibge.py. Gerada UMA vez, em 2026-09-22,
# a partir dos manifestos do REVIA_BG (manifesto_censo_<ano>.json, hoje em
# docs/procedencia/revia_bg_censo/), que registraram cada arquivo baixado do
# IBGE em 2026-09-20 navegando as listagens do FTP. Desde então o download não
# depende mais do REVIA_BG: a URL, o tamanho, o Last-Modified e o sha256
# esperados estão aqui.
#
# destino.base é uma chave de `paths:` em config.yaml; destino.subdir é
# relativo a ela. `caminho_revia_bg` só serve à semeadura (--semear) e ao
# rastro: é onde o arquivo estava na cópia do REVIA_BG.
#
# Acrescentados em 2026-09-22 (itens sem `caminho_revia_bg`): rendimento do
# responsável por setor 2022 e grade estatística 2010/2022 (quadrantes 14 e 04,
# que cobrem Bagé — conferido contra config/area_estudo.geojson). URLs obtidas
# NAVEGANDO as listagens do FTP; bytes e Last-Modified por HEAD; sha256 fixado
# no primeiro download. O bloco `fontes:` descreve as linhas de catálogo novas.
#
# Acrescentados em 2026-09-22 (2ª leva, mesmo procedimento): entorno urbanístico
# por setor 2022 (3 CSV + dicionários) e favelas e comunidades urbanas por setor
# 2022 (planilha de setores + apresentação; não há dicionário próprio).
#
# Acrescentados em 2026-09-22 (3ª leva): metodologia do Censo 2010 (entorno),
# aglomerados subnormais 2010 (setores, notas técnicas, tabelas municipais) e a
# cobertura do entorno nas FCU 2022. A metodologia do entorno 2022 e a nota
# metodológica de 2024 sobre a mudança para FCU NÃO estão no FTP.
#
# Acrescentado em 2026-09-22 (4ª leva): a publicação do entorno 2022 (IBGE,
# 2025, liv102168.pdf), obtida MANUALMENTE pelo responsável no navegador — a
# biblioteca do IBGE bloqueia acesso automatizado (HTTP 403). Item com
# `obtencao: manual`: sha256 e bytes calculados do arquivo local, sem
# Last-Modified; o script não baixa nem verifica esse item.
#
# Ficou de fora a malha territorial de setores 2022 do geoftp
# (RS_setores_CD2022.gpkg, sha256 3816950f…): ela é baixada por
# scripts/download/baixar_malhas_ibge.py (fonte ibge_malha_setores_2022).
# ---------------------------------------------------------------------------
