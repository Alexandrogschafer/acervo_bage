# ---------------------------------------------------------------------------
# config.yaml — parâmetros do acervo ACERVO_BAGE
#
# Fonte única de verdade. Nenhum script deve repetir código IBGE, CRS ou
# caminho: tudo sai daqui, via scripts/utils/paths.py. Se um valor precisa
# mudar, muda aqui e em lugar nenhum mais.
#
# Os caminhos são relativos à raiz do repositório (o diretório que contém
# este config/). paths.py resolve a raiz sozinho.
# ---------------------------------------------------------------------------

municipio:
  nome: "Bagé"
  uf: "RS"
  codigo_ibge: "4301602"

crs:
  # CRS métrico de trabalho: produção, operações espaciais e medição de
  # distância, perímetro e buffer. SIRGAS 2000 / UTM 21S. Área NÃO: ver `area`.
  producao: "EPSG:31981"
  # CRS de publicação: único que o Leaflet consome. A reprojeção para cá é
  # sempre o último passo, depois de qualquer operação métrica.
  publicacao: "EPSG:4326"
  # CRS de medição de ÁREA: equivalente (preserva área). O UTM 21S não é
  # equivalente e Bagé fica na borda leste do fuso 21 — a área medida nele sai
  # ~0,12% maior. Só medidas de área usam este CRS; distância, perímetro e
  # produção continuam no CRS de produção. South America Albers Equal Area Conic.
  area: "ESRI:102033"

# Recorte de referência do acervo, em EPSG:4326 (RFC 7946). Gerado por
# scripts/processamento/area_estudo.py a partir da camada `limite_municipal`;
# lido já no CRS de produção por paths.carregar_area_estudo().
area_estudo: "config/area_estudo.geojson"

paths:
  # --- entrada ---
  raw: "data/raw"
  raw_vetor: "data/raw/vetor"
  raw_raster: "data/raw/raster"
  raw_tabular: "data/raw/tabular"
  # legislação municipal e documentos que chegaram junto (SICG/IPHAN, relatório
  # do PlanMob): como vieram, nome original preservado (o nome é procedência)
  raw_legislacao: "data/raw/legislacao/bage"

  # --- acervo: a CÓPIA PRINCIPAL, compartilhada por todos os estudos ---
  # Estudo nenhum escreve aqui. Camada derivada em estudo só entra no acervo
  # por promoção explícita, depois de conferência visual do responsável.
  acervo: "data/acervo"
  acervo_limites: "data/acervo/limites"
  acervo_censo: "data/acervo/censo"
  acervo_hidrografia: "data/acervo/hidrografia"
  acervo_viario: "data/acervo/viario"
  acervo_cadastro: "data/acervo/cadastro"
  acervo_educacao: "data/acervo/educacao"
  acervo_saude: "data/acervo/saude"
  acervo_ambiental: "data/acervo/ambiental"

  # Cópias de camadas vindas de OUTROS projetos, com versão e sha256 fixados.
  externos: "data/externos"

  # Publicação do geoportal (versionada: o portal estático precisa em runtime).
  geoportal: "data/geoportal"

  # --- listas fixas de download ---
  # arquivos do Censo no IBGE (URL, bytes, Last-Modified, sha256 esperados)
  fontes_censo_ibge: "config/fontes_censo_ibge.yaml"

  # --- catálogos ---
  catalogo_fontes: "data/catalogo_fontes.csv"
  catalogo_camadas: "data/catalogo_camadas.csv"
  # uma linha por norma (ou documento), preenchida lendo o cabeçalho de cada PDF
  catalogo_legislacao: "data/catalogo_legislacao.csv"

  # --- código ---
  scripts: "scripts"
  scripts_download: "scripts/download"
  scripts_processamento: "scripts/processamento"
  scripts_acervo: "scripts/acervo"
  scripts_geoportal: "scripts/geoportal"
  scripts_bibliografia: "scripts/bibliografia"
  scripts_utils: "scripts/utils"

  # --- estudos: consomem o acervo, nunca escrevem nele ---
  estudos: "estudos"

  # --- demais ---
  bibliografia: "bibliografia"
  bibliografia_bib: "bibliografia/bage.bib"
  docs: "docs"
  notebooks: "notebooks"
  css: "css"
  js: "js"
  config: "config"
